<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Improved Google Tasks</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header>
    <h1>Improved Google Tasks</h1>
    <div class="header-actions">
      <button id="add-task-toggle" title="Add task" hidden>+</button>
      <button id="refresh-btn" title="Refresh" hidden>&#8635;</button>
      <button id="signout-btn" hidden>Sign out</button>
    </div>

    <form id="add-task-form" hidden>
      <select id="add-task-list" aria-label="List to add to"></select>
      <input type="text" id="add-task-title" placeholder="Add a task..." required />
      <input type="date" id="add-task-due" aria-label="Due date (optional)" />
      <button type="submit">Add</button>
    </form>
  </header>

  <div id="signin-view">
    <p>Sign in with Google to load your tasks.</p>
    <button id="signin-btn">Sign in with Google</button>
  </div>

  <div id="status" role="status"></div>

  <main id="lists-view" hidden>
    <section id="in-progress-section" class="tasklist in-progress-section" hidden>
      <h2 class="tasklist-title">In Progress</h2>
      <ul class="task-rows" id="in-progress-rows"></ul>
    </section>
    <div id="per-list-sections"></div>
  </main>

  <template id="list-template">
    <section class="tasklist">
      <h2 class="tasklist-title"></h2>
      <ul class="task-rows"></ul>
    </section>
  </template>

  <template id="task-row-template">
    <li class="task-row">
      <div class="task-main">
        <input type="checkbox" class="complete-checkbox" title="Mark complete" />
        <span class="task-expand" role="button" tabindex="0">
          <span class="severity-dot"></span>
          <span class="task-title"></span>
          <span class="task-list-badge"></span>
          <span class="task-due"></span>
        </span>
      </div>
      <div class="progress-track" title="">
        <div class="progress-fill"></div>
      </div>
      <div class="task-detail" hidden>
        <label class="progress-label">
          Progress: <span class="progress-value"></span>%
          <input type="range" class="progress-input" min="0" max="100" step="5" />
        </label>
        <p class="task-notes-text"></p>
      </div>
    </li>
  </template>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
